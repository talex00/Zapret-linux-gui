<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <!--
    Геометрия повторяет логотип Windows-версии: щит с львиной маской.
    Под ртом лежит тёмный ореол: без него рот сливался с носом на малых размерах.
