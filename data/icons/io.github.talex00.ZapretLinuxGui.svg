  <path d="M39 80 C 44 89 56 89 61 80" fill="none" stroke="#14336F" stroke-width="9" stroke-linecap="round" />
  <path d="M39 80 C 44 89 56 89 61 80" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" />
</svg>
